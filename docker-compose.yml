# 사용법:  DOMAIN=files.example.com docker compose up -d --build
# - DOMAIN 의 DNS A 레코드가 이 서버 IP 를 가리키고, 80/443 포트가 열려 있어야
#   Caddy 가 Let's Encrypt 인증서를 자동으로 발급/갱신한다.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      BASE_URL: "https://${DOMAIN:?DOMAIN 환경변수를 지정하세요 (예: DOMAIN=files.example.com)}"
      TRUST_PROXY: "true"   # app 포트를 밖으로 publish 하지 않으므로(Caddy 만 접근) 안전하다
      MAX_UPLOAD_MB: "20"
      MAX_TOTAL_MB: "1024"
      TTL_HOURS: "24"
      RATE_PER_MIN: "30"
    volumes:
      - data:/data
    expose:
      - "8080"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  data:
  caddy_data:
  caddy_config:
