<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FileShare</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="wrap">
    <header>
      <h1>FileShare</h1>
      <p class="sub">파일을 올리면 공유 링크가 만들어집니다. 웹과 <code>curl</code> 모두 지원합니다.</p>
      <p id="limits" class="muted"></p>
    </header>

    <section class="card">
      <label id="dropzone" class="dropzone" for="file" tabindex="0">
        <input id="file" type="file" hidden>
        <strong>파일을 여기에 끌어다 놓거나 클릭해서 선택하세요</strong>
        <span id="picked" class="muted">선택된 파일 없음</span>
      </label>
      <div class="row">
        <button id="submit" type="button" disabled>업로드</button>
        <progress id="progress" value="0" max="100" hidden></progress>
      </div>
      <p id="error" class="error" role="alert" hidden></p>
    </section>

    <section id="result" class="card" hidden>
      <h2>업로드 완료</h2>
      <div class="row">
        <input id="link" type="text" readonly aria-label="공유 링크">
        <button id="copy" type="button">복사</button>
      </div>
      <dl>
        <dt>만료</dt><dd id="expires"></dd>
        <dt>SHA-256</dt><dd id="sha" class="mono"></dd>
        <dt>삭제 키</dt><dd id="delkey" class="mono"></dd>
      </dl>
      <p class="muted">삭제 키는 이 화면에서만 보여줍니다. 잃어버리면 만료 전까지 삭제할 수 없습니다.</p>
    </section>

    <section class="card">
      <h2>curl 사용법</h2>
      <pre id="curl"></pre>
    </section>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
